<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViveVerde | Productos</title>

    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/main.css">

</head>

<body>

    <header class="header">

        <div class="logo">
            <img src="imagenas_para_el_proyecto/logo/logo3.png" alt="">
        </div>

        <nav class="nav">
            <a href="../index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="sobre-nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>

    </header>

    <!-- CATÁLOGO -->

    <main class="contenedor-catalogo">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <h3>Categorías</h3>

            <ul>
                <button>Kit</button>
                <button>Botellas</button>
                <button>Jabón</button>
                <button>Bolsas</button>
            </ul>

        </aside>

        <!-- PRODUCTOS -->

        <section class="catalogo">

            <div class="buscador">

                <input type="text" placeholder="Buscar producto">

            </div>

            <div class="grid-catalogo">

                <article class="card-producto">
                    <img src="imagenas_para_el_proyecto/productos/kit.png">
                    <h3>Kit Eco</h3>
                    <p>$40.000</p>
                    <button class="favorito">❤</button>
                </article>

                <article class="card-producto">
                    <img src="imagenas_para_el_proyecto/productos/botella ecologica.png">
                    <h3>Botella</h3>
                    <p>$30.000</p>
                    <button class="favorito">❤</button>
                </article>

                <article class="card-producto">
                    <img src="imagenas_para_el_proyecto/productos/jabon.png">
                    <h3>Jabón</h3>
                    <p>$15.000</p>
                    <button class="favorito">❤</button>
                </article>

                <article class="card-producto">
                    <img src="imagenas_para_el_proyecto/productos/cepillos bambu.png">
                    <h3>Cepillo</h3>
                    <p>$12.000</p>
                    <button class="favorito">❤</button>
                </article>

            </div>

            <!-- PAGINACIÓN -->

            <div class="paginacion">

                <button>Anterior</button>
                <button>1</button>
                <button>2</button>
                <button>Siguiente</button>

            </div>

        </section>

    </main>

    <footer class="footer">

        <p>© 2026 ViveVerde</p>

    </footer>
</body>

</html>
