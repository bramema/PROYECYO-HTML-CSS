<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vive Verde | Productos</title>

    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/main.css">

</head>

<body>

    <header class="header">

        <div class="logo">
            <img src="imagenas para el proyecto/logo/logo 2.png" alt="">
        </div>

        <nav class="nav">
            <a href="../index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="sobre-nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>

    </header>

    <!-- CATÁLOGO -->

    <main class="contenedor-catalogo">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <h3>Categorías</h3>

            <ul>
                <button>Hogar</button>
                <button>Moda</button>
                <button>Cuidado Personal</button>
                <button>Alimentos</button>
            </ul>

        </aside>

        <!-- PRODUCTOS -->

        <section class="catalogo">

            <div class="buscador">

                <input type="text" placeholder="Buscar producto">

            </div>

            <div class="grid-catalogo">

                <article class="card-producto">
                    <img src="imagenas para el proyecto/productos/kit.png">
                    <h3>Kit Eco</h3>
                    <p>$40.000</p>
                    <button class="favorito">❤</button>
                </article>

                <article class="card-producto">
                    <img src="imagenas para el proyecto/productos/botella ecologica.png">
                    <h3>Botella</h3>
                    <p>$30.000</p>
                    <button class="favorito">❤</button>
                </article>

                <article class="card-producto">
                    <img src="imagenas para el proyecto/productos/jabon.png">
                    <h3>Jabón</h3>
                    <p>$15.000</p>
                    <button class="favorito">❤</button>
                </article>

                <article class="card-producto">
                    <img src="imagenas para el proyecto/productos/cepillos bambu.png">
                    <h3>Cepillo</h3>
                    <p>$12.000</p>
                    <button class="favorito">❤</button>
                </article>

            </div>

            <!-- PAGINACIÓN -->

            <div class="paginacion">

                <button>Anterior</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>Siguiente</button>

            </div>

        </section>

    </main>

</body>

</html>
